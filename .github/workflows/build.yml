name: build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly: catch breakage from new compilers or libraries
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]   # GCC 13 and GCC 15
        blas: [reference, openblas]
    steps:
      - uses: actions/checkout@v7

      - name: Install prerequisites
        run: |
          case "${{ matrix.blas }}" in
            openblas) blas="libopenblas-dev" ;;
            *)        blas="libblas-dev liblapack-dev" ;;
          esac
          sudo apt-get update
          sudo apt-get install -y build-essential $blas python3 curl

      - name: Build
        run: |
          gcc --version | head -1
          bash build.sh

      - name: Run examples
        run: bash run_examples.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-${{ matrix.blas }}
          path: |
            build/*/configure.log
            build/*/*/make.log
            run/
          if-no-files-found: ignore

  # AddressSanitizer and UndefinedBehaviorSanitizer: any invalid memory access
  # or undefined behaviour stops amlet, and the example fails. Leaks are not
  # checked (memory is not always freed, see src/amlet-0.13.1/KNOWN_BUGS).
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libblas-dev liblapack-dev python3 curl

      - name: Build
        env:
          CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all
          LDFLAGS: -fsanitize=address,undefined
        run: bash build.sh

      - name: Run examples
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash run_examples.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sanitizers
          path: |
            build/*/configure.log
            build/*/*/make.log
            run/
          if-no-files-found: ignore
